// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext.kotlin_version = '2.1.0'
    ext.min_sdk_version = 23
    ext.compile_sdk_version = 34
    ext.target_sdk_version = 34
    ext.androidx_core_version = '1.12.0'
    ext.androidx_appcompat_version = '1.6.1'
    ext.gson_version = '2.10.1'
    ext.junit_version = '4.13.2'
    ext.androidx_test_runner_version = '1.5.2'
    ext.androidx_test_espresso_version = '3.5.1'
    repositories {
        google()
        gradlePluginPortal()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.5.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
        maven { url 'https://jitpack.io' }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
